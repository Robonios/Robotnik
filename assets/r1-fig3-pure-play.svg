<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="'Mulish','Inter',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="45%" cy="42%" r="85%">
      <stop offset="0%" stop-color="#1C2233"/>
      <stop offset="60%" stop-color="#161A26"/>
      <stop offset="100%" stop-color="#10131C"/>
    </radialGradient>
    <linearGradient id="gYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8E24E"/>
      <stop offset="100%" stop-color="#EFCE17"/>
    </linearGradient>
    <filter id="yGlow" x="-160%" y="-160%" width="420%" height="420%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,1 L7,4.5 L0,8 Z" fill="#3A4153"/>
    </marker>
  </defs>

  <rect width="900" height="470" fill="url(#bg)"/>

  <!-- header -->
  <text x="40" y="48" font-family="'Space Grotesk','Inter',sans-serif" font-size="18" font-weight="700" letter-spacing="2.5" fill="#EDEFF5">POSITION, NOT REVENUE SHARE</text>
  <text x="40" y="73" font-size="13.5" fill="#8A93A6">What admits a company to the stack is the frontier position it holds, not its share of frontier revenue.</text>
  <line x1="40" y1="86" x2="120" y2="86" stroke="#F5D921" stroke-width="3" stroke-linecap="round"/>

  <!-- decision plane. x: frontier revenue share (low -> high). y: chokepoint the stack depends on (none -> strong). -->
  <!-- IN via a chokepoint: low revenue, strong chokepoint (top-left) -->
  <rect x="182" y="116" width="250" height="134" fill="#F5D921" fill-opacity="0.06"/>
  <!-- IN via core business: high revenue (right column) -->
  <rect x="432" y="116" width="380" height="232" fill="#F5D921" fill-opacity="0.038"/>
  <!-- OUT: low revenue AND no chokepoint (bottom-left) -->
  <rect x="182" y="250" width="250" height="98" rx="4" fill="#171B26" fill-opacity="0.72" stroke="#3A4153" stroke-opacity="0.7" stroke-dasharray="4 4"/>

  <!-- revenue threshold (dividing low from high) -->
  <line x1="432" y1="116" x2="432" y2="348" stroke="#4A5265" stroke-opacity="0.42" stroke-width="1.2" stroke-dasharray="2 5"/>

  <!-- axes -->
  <line x1="182" y1="348" x2="822" y2="348" stroke="#3A4153" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="182" y1="348" x2="182" y2="106" stroke="#3A4153" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- axis titles + direction -->
  <text x="190" y="371" font-size="10.5" fill="#6E7689">low</text>
  <text x="812" y="371" text-anchor="end" font-size="10.5" fill="#6E7689">high</text>
  <text x="500" y="391" text-anchor="middle" font-family="'Space Grotesk','Inter',sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#8A93A6">FRONTIER SHARE OF REVENUE</text>
  <text x="45" y="232" text-anchor="middle" font-family="'Space Grotesk','Inter',sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#8A93A6" transform="rotate(-90 45 232)">CHOKEPOINT THE STACK DEPENDS ON</text>

  <!-- region tags -->
  <text x="422" y="134" text-anchor="end" font-size="10" letter-spacing="1.4" fill="#F5D921" fill-opacity="0.72">IN</text>
  <text x="802" y="134" text-anchor="end" font-size="10" letter-spacing="1.4" fill="#F5D921" fill-opacity="0.66">IN</text>
  <text x="196" y="270" font-family="'Space Grotesk','Inter',sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#7E8698">OUT</text>

  <!-- same revenue share: Linde and Alphabet share the revenue column -->
  <line x1="300" y1="190" x2="300" y2="290" stroke="#5A6276" stroke-opacity="0.55" stroke-width="1.1" stroke-dasharray="3 4"/>
  <text x="288" y="238" text-anchor="end" font-size="10" fill="#8A93A6">same frontier</text>
  <text x="288" y="251" text-anchor="end" font-size="10" fill="#8A93A6">revenue share</text>

  <!-- Linde: low revenue, holds a chokepoint -> IN (highlighted) -->
  <circle cx="300" cy="178" r="18" fill="#F5D921" fill-opacity="0.28" filter="url(#yGlow)"/>
  <circle cx="300" cy="178" r="7.5" fill="url(#gYellow)"/>
  <circle cx="300" cy="178" r="7.5" fill="none" stroke="#F8E24E" stroke-opacity="0.5" stroke-width="1"/>
  <text x="318" y="174" font-family="'Space Grotesk','Inter',sans-serif" font-size="14" font-weight="700" fill="#F5D921">Linde</text>
  <text x="318" y="191" font-size="11" fill="#9AA3B5">holds a chokepoint the stack needs</text>

  <!-- Pure play: high revenue, core business -> IN -->
  <circle cx="672" cy="270" r="15" fill="#F5D921" fill-opacity="0.24" filter="url(#yGlow)"/>
  <circle cx="672" cy="270" r="7" fill="url(#gYellow)"/>
  <text x="655" y="266" text-anchor="end" font-family="'Space Grotesk','Inter',sans-serif" font-size="14" font-weight="700" fill="#F5D921">Pure play</text>
  <text x="655" y="283" text-anchor="end" font-size="11" fill="#9AA3B5">the frontier is its whole business</text>

  <!-- Alphabet: low revenue, no chokepoint -> OUT -->
  <circle cx="300" cy="300" r="7" fill="#333A47"/>
  <circle cx="300" cy="300" r="7" fill="none" stroke="#4A5265" stroke-width="1"/>
  <text x="318" y="296" font-family="'Space Grotesk','Inter',sans-serif" font-size="14" font-weight="700" fill="#8A93A6">Alphabet</text>
  <text x="318" y="313" font-size="11" fill="#6E7689">a diversified touch, no chokepoint</text>

  <!-- footnote -->
  <text x="40" y="440" font-size="11.5" fill="#8A93A6">Linde and Alphabet sit at the same low frontier revenue share; the chokepoint, not the share, decides membership.</text>
  <text x="40" y="459" font-size="10.5" fill="#5A6276">Illustrative; positions are schematic.</text>
</svg>
