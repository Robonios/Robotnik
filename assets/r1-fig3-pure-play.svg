<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="'Mulish','Inter',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="45%" cy="42%" r="85%">
      <stop offset="0%" stop-color="#1C2233"/>
      <stop offset="60%" stop-color="#161A26"/>
      <stop offset="100%" stop-color="#10131C"/>
    </radialGradient>
    <linearGradient id="gAd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#333947"/>
      <stop offset="100%" stop-color="#262B36"/>
    </linearGradient>
    <linearGradient id="gCloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#404756"/>
      <stop offset="100%" stop-color="#333A47"/>
    </linearGradient>
    <linearGradient id="gYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8E24E"/>
      <stop offset="100%" stop-color="#EFCE17"/>
    </linearGradient>
    <filter id="yGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="bar1clip"><rect x="60" y="164" width="760" height="56" rx="6"/></clipPath>
  </defs>

  <rect width="900" height="470" fill="url(#bg)"/>

  <text x="40" y="48" font-family="'Space Grotesk','Inter',sans-serif" font-size="18" font-weight="700" letter-spacing="2.5" fill="#EDEFF5">PURE-PLAY, NOT DILUTED</text>
  <text x="40" y="73" font-size="13.5" fill="#8A93A6">What you actually own when you buy the frontier through a mega-cap.</text>
  <line x1="40" y1="86" x2="120" y2="86" stroke="#F5D921" stroke-width="3" stroke-linecap="round"/>

  <!-- bar 1: diversified mega-cap -->
  <text x="60" y="150" font-family="'Space Grotesk','Inter',sans-serif" font-size="13.5" font-weight="700" fill="#C9CFDA">Diversified mega-cap</text>
  <text x="228" y="150" font-size="12" fill="#6E7689">(e.g. Alphabet)</text>
  <rect x="806" y="158" width="20" height="68" rx="4" fill="#F5D921" fill-opacity="0.55" filter="url(#yGlow)"/>
  <g clip-path="url(#bar1clip)">
    <rect x="60" y="164" width="555" height="56" fill="url(#gAd)"/>
    <rect x="615" y="164" width="197" height="56" fill="url(#gCloud)"/>
    <rect x="812" y="164" width="8" height="56" fill="url(#gYellow)"/>
  </g>
  <text x="337" y="197" text-anchor="middle" font-size="12" fill="#9AA3B5">Advertising ≈ ¾ of revenue</text>
  <text x="713" y="197" text-anchor="middle" font-size="11" fill="#9AA3B5">Cloud &amp; other</text>
  <line x1="816" y1="160" x2="816" y2="144" stroke="#F5D921" stroke-width="1.3" stroke-linecap="round"/>
  <text x="816" y="138" text-anchor="middle" font-size="11.5" font-weight="700" fill="#F5D921">frontier &lt; 1%</text>

  <!-- bar 2: pure play -->
  <text x="60" y="266" font-family="'Space Grotesk','Inter',sans-serif" font-size="13.5" font-weight="700" fill="#C9CFDA">Pure play</text>
  <text x="143" y="266" font-size="12" fill="#6E7689">(a frontier operator or integrator)</text>
  <rect x="60" y="276" width="760" height="64" rx="8" fill="#F5D921" fill-opacity="0.26" filter="url(#yGlow)"/>
  <rect x="60" y="280" width="760" height="56" rx="6" fill="url(#gYellow)"/>
  <text x="440" y="313" text-anchor="middle" font-family="'Space Grotesk','Inter',sans-serif" font-size="13" font-weight="700" fill="#161A26">Frontier exposure ≈ 100%</text>

  <text x="60" y="392" font-size="13" fill="#8A93A6">Through the mega-cap you own the grey. The pure play is the stack itself.</text>
  <text x="60" y="424" font-size="10.5" fill="#5A6276">Illustrative; revenue shares from company filings.</text>
</svg>
