<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="'Mulish','Inter',system-ui,sans-serif">
  <rect x="0" y="0" width="900" height="470" fill="#161A26"/>
  <text x="40" y="48" font-family="'Space Grotesk','Inter',sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#E8EBF1">PURE-PLAY, NOT DILUTED</text>
  <text x="40" y="72" font-size="13" fill="#868FA2">What you actually own when you buy the frontier through a mega-cap.</text>
  <line x1="40" y1="84" x2="116" y2="84" stroke="#F5D921" stroke-width="2.5"/>

  <!-- bar 1: diversified mega-cap -->
  <text x="60" y="150" font-family="'Space Grotesk','Inter',sans-serif" font-size="13.5" font-weight="700" fill="#C9CFDA">Diversified mega-cap</text>
  <text x="227" y="150" font-size="12" fill="#6E7689">— e.g. Alphabet</text>
  <rect x="60" y="164" width="555" height="56" fill="#2C313E"/>
  <text x="337" y="196" text-anchor="middle" font-size="12" fill="#9AA3B5">Advertising ≈ ¾ of revenue</text>
  <rect x="615" y="164" width="197" height="56" fill="#3A4150"/>
  <text x="713" y="196" text-anchor="middle" font-size="11" fill="#9AA3B5">Cloud &amp; other</text>
  <rect x="812" y="164" width="8" height="56" fill="#F5D921"/>
  <line x1="816" y1="164" x2="816" y2="144" stroke="#F5D921" stroke-width="1.2"/>
  <text x="816" y="138" text-anchor="middle" font-size="11.5" fill="#F5D921">frontier &lt; 1%</text>

  <!-- bar 2: pure play -->
  <text x="60" y="266" font-family="'Space Grotesk','Inter',sans-serif" font-size="13.5" font-weight="700" fill="#C9CFDA">Pure play</text>
  <text x="143" y="266" font-size="12" fill="#6E7689">— a frontier operator or integrator</text>
  <rect x="60" y="280" width="760" height="56" fill="#F5D921"/>
  <text x="440" y="313" text-anchor="middle" font-family="'Space Grotesk','Inter',sans-serif" font-size="13" font-weight="700" fill="#161A26">Frontier exposure ≈ 100%</text>

  <!-- caption -->
  <text x="60" y="392" font-size="13" fill="#868FA2">Through the mega-cap you own the grey. The pure play is the stack itself.</text>
  <text x="60" y="424" font-size="10.5" fill="#5A6276">Illustrative; revenue shares from company filings.</text>
</svg>
