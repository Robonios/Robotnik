<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="'Mulish','Inter',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="47%" cy="44%" r="78%">
      <stop offset="0%" stop-color="#1C2233"/>
      <stop offset="58%" stop-color="#161A26"/>
      <stop offset="100%" stop-color="#10131C"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34415F" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#2A3145" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#2A3145" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pillBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F2331"/>
      <stop offset="100%" stop-color="#14171F"/>
    </linearGradient>
    <linearGradient id="fSpace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8765C" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#E8765C" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="fRobotics" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#46B49A" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#46B49A" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="fSemi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B8DD6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#5B8DD6" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="fMaterials" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9B7BD0" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#9B7BD0" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="nodeGlow" x="-80%" y="-180%" width="260%" height="460%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="edgeGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <rect width="900" height="600" fill="url(#bg)"/>
  <ellipse cx="450" cy="322" rx="390" ry="252" fill="url(#halo)"/>

  <text x="40" y="48" font-family="'Space Grotesk','Inter',sans-serif" font-size="18" font-weight="700" letter-spacing="2.5" fill="#EDEFF5">THE FRONTIER STACK</text>
  <text x="40" y="73" font-size="13.5" fill="#8A93A6">Every sector depends on the same inputs — and through them, on every other sector.</text>
  <line x1="40" y1="86" x2="120" y2="86" stroke="#F5D921" stroke-width="3" stroke-linecap="round"/>

  <!-- edges routed to node centres; the opaque pills cap each line so it terminates exactly at its own border -->
  <g filter="url(#edgeGlow)" stroke-linecap="round">
    <line x1="200" y1="320" x2="700" y2="320" stroke="#9B7BD0" stroke-width="3" stroke-opacity="0.30"/>
    <line x1="200" y1="320" x2="450" y2="150" stroke="#9B7BD0" stroke-width="3" stroke-opacity="0.30"/>
    <line x1="705" y1="327" x2="455" y2="157" stroke="#9B7BD0" stroke-width="3" stroke-opacity="0.30"/>
    <line x1="450" y1="490" x2="700" y2="320" stroke="#5B8DD6" stroke-width="3" stroke-opacity="0.30"/>
    <line x1="450" y1="490" x2="450" y2="150" stroke="#5B8DD6" stroke-width="3" stroke-opacity="0.30"/>
    <line x1="695" y1="313" x2="445" y2="143" stroke="#5B8DD6" stroke-width="3" stroke-opacity="0.30"/>
    <line x1="200" y1="320" x2="450" y2="490" stroke="#8893A6" stroke-width="3" stroke-opacity="0.28"/>
  </g>
  <g stroke-linecap="round">
    <line x1="200" y1="320" x2="700" y2="320" stroke="#9B7BD0" stroke-width="1.6" stroke-opacity="0.85"/>
    <line x1="200" y1="320" x2="450" y2="150" stroke="#9B7BD0" stroke-width="1.6" stroke-opacity="0.85"/>
    <line x1="705" y1="327" x2="455" y2="157" stroke="#9B7BD0" stroke-width="1.6" stroke-opacity="0.85"/>
    <line x1="450" y1="490" x2="700" y2="320" stroke="#5B8DD6" stroke-width="1.6" stroke-opacity="0.85"/>
    <line x1="450" y1="490" x2="450" y2="150" stroke="#5B8DD6" stroke-width="1.6" stroke-opacity="0.85"/>
    <line x1="695" y1="313" x2="445" y2="143" stroke="#5B8DD6" stroke-width="1.6" stroke-opacity="0.85"/>
    <line x1="200" y1="320" x2="450" y2="490" stroke="#8893A6" stroke-width="1.6" stroke-opacity="0.78"/>
  </g>

  <!-- nodes: glow halo, opaque base (caps the lines), sector tint, border, label -->
  <g>
    <rect x="380" y="128" width="140" height="44" rx="22" fill="#E8765C" fill-opacity="0.42" filter="url(#nodeGlow)"/>
    <rect x="380" y="128" width="140" height="44" rx="22" fill="url(#pillBase)"/>
    <rect x="380" y="128" width="140" height="44" rx="22" fill="url(#fSpace)" stroke="#E8765C" stroke-width="1.6"/>
    <text x="450" y="156" text-anchor="middle" font-family="'Space Grotesk','Inter',sans-serif" font-size="16" font-weight="700" fill="#F4A892">Space</text>
  </g>
  <g>
    <rect x="625" y="298" width="150" height="44" rx="22" fill="#46B49A" fill-opacity="0.42" filter="url(#nodeGlow)"/>
    <rect x="625" y="298" width="150" height="44" rx="22" fill="url(#pillBase)"/>
    <rect x="625" y="298" width="150" height="44" rx="22" fill="url(#fRobotics)" stroke="#46B49A" stroke-width="1.6"/>
    <text x="700" y="326" text-anchor="middle" font-family="'Space Grotesk','Inter',sans-serif" font-size="16" font-weight="700" fill="#82D6C0">Robotics</text>
  </g>
  <g>
    <rect x="365" y="468" width="170" height="44" rx="22" fill="#5B8DD6" fill-opacity="0.42" filter="url(#nodeGlow)"/>
    <rect x="365" y="468" width="170" height="44" rx="22" fill="url(#pillBase)"/>
    <rect x="365" y="468" width="170" height="44" rx="22" fill="url(#fSemi)" stroke="#5B8DD6" stroke-width="1.6"/>
    <text x="450" y="496" text-anchor="middle" font-family="'Space Grotesk','Inter',sans-serif" font-size="15" font-weight="700" fill="#97B9EA">Semiconductors</text>
  </g>
  <g>
    <rect x="120" y="298" width="160" height="44" rx="22" fill="#9B7BD0" fill-opacity="0.42" filter="url(#nodeGlow)"/>
    <rect x="120" y="298" width="160" height="44" rx="22" fill="url(#pillBase)"/>
    <rect x="120" y="298" width="160" height="44" rx="22" fill="url(#fMaterials)" stroke="#9B7BD0" stroke-width="1.6"/>
    <text x="200" y="326" text-anchor="middle" font-family="'Space Grotesk','Inter',sans-serif" font-size="16" font-weight="700" fill="#C6B0E8">Materials</text>
  </g>

  <!-- legend: swatches rendered as the edges they denote -->
  <g font-size="12.5" fill="#8A93A6">
    <line x1="150" y1="556" x2="176" y2="556" stroke="#9B7BD0" stroke-width="3.2" stroke-linecap="round" filter="url(#edgeGlow)"/>
    <line x1="150" y1="556" x2="176" y2="556" stroke="#9B7BD0" stroke-width="2" stroke-linecap="round"/>
    <text x="186" y="560">rare-earth magnets</text>
    <line x1="372" y1="556" x2="398" y2="556" stroke="#5B8DD6" stroke-width="3.2" stroke-linecap="round" filter="url(#edgeGlow)"/>
    <line x1="372" y1="556" x2="398" y2="556" stroke="#5B8DD6" stroke-width="2" stroke-linecap="round"/>
    <text x="408" y="560">advanced chips</text>
    <line x1="560" y1="556" x2="586" y2="556" stroke="#8893A6" stroke-width="3.2" stroke-linecap="round" filter="url(#edgeGlow)"/>
    <line x1="560" y1="556" x2="586" y2="556" stroke="#8893A6" stroke-width="2" stroke-linecap="round"/>
    <text x="596" y="560">silicon · specialty gases · substrates</text>
  </g>
</svg>
