name: History seam scan (temp)

# Temporary read-only audit: restores the price-history cache and reports split-like steps.
# Prints tickers, dates and ratios only. Removed before the branch's pull request.
on:
  push:
    branches: [claude/history-seams-20261123]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore the price-history cache (read-only)
        uses: actions/cache/restore@v5
        with:
          path: |
            data/prices/history
            data/index/market_caps.json
          key: robotnik-price-history-v1-scan-${{ github.run_id }}
          restore-keys: |
            robotnik-price-history-v1-
      - name: Seam report before the repair
        run: python3 scripts/check_history_seams.py | grep -E " JP |RESULT|HISTORY" || true
      - name: Repair (this runner's copy only; the cache is not saved)
        run: |
          python3 scripts/repair_history_seams.py
          python3 scripts/repair_history_seams.py --apply
          python3 scripts/repair_history_seams.py --apply
      - name: Seam report after the repair
        run: python3 scripts/check_history_seams.py | grep -E " JP |RESULT|HISTORY" || true
      - name: E12 on the repaired copy
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import check_entity_lifecycle as lc
          found = lc.check_seams(lc.index_members())
          print("E12 findings:", len(found))
          for f in found:
              print("  ", f)
          PY
