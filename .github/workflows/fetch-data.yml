name: Robotnik Data Pipeline

on:
  schedule:
    - cron: '0 22 * * 1-5'   # Weekdays at 22:00 UTC — EOD pipeline (after US close)
    - cron: '0 5 * * 0'      # Sunday at 05:00 UTC — market caps refresh
    - cron: '0 23 * * 0'    # Sunday at 23:00 UTC — weekly health check
    # (live-prices 30-min job removed at MarketStack cutover — EODHD intraday,
    #  not displayed, not the product; saved ~8.7k EODHD calls/mo)
  workflow_dispatch:
    inputs:
      run_intel:
        description: 'Also run intel fetchers (news/research/filings/reports)?'
        type: boolean
        default: false

jobs:
  # (live-prices intraday job removed at MarketStack cutover — EODHD, not displayed)

  # ── Full EOD pipeline (after US market close) ──
  fetch-prices:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 22 * * 1-5' || github.event.schedule == '0 5 * * 0' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── PRICES: MarketStack (PR, daily-FX, split-adjusted) + Yahoo overrides
      #    + assemble. fetch_prices_marketstack writes equities.json (MS),
      #    fetch_yahoo_overrides merges the override names, assemble_all_prices
      #    combines with tokens into all_prices.json. EODHD is OFF this path.
      - name: Fetch prices (MarketStack + Yahoo overrides + assemble)
        env:
          MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
        run: |
          python scripts/fetch_prices_marketstack.py
          python scripts/fetch_yahoo_overrides.py --overrides
          python scripts/assemble_all_prices.py

      - name: Fetch market caps (Yahoo)
        run: python scripts/fetch_market_caps.py

      - name: Refresh price history (MarketStack + Yahoo overrides, merges)
        env:
          MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
        # --refresh pulls the last 45 days per ticker and merges with the on-disk
        # 5-year series; the Yahoo pass refreshes the override names' history.
        run: |
          python scripts/fetch_price_history_marketstack.py --refresh
          python scripts/fetch_yahoo_overrides.py --history-overrides

      - name: Backfill any newly-added tickers (no-op when universe stable)
        env:
          MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
        run: python scripts/fetch_price_history_marketstack.py --backfill

      - name: Fetch benchmark prices (MarketStack, split-adjusted PR)
        env:
          MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
        run: python scripts/fetch_benchmarks.py

      - name: Calculate Robotnik Index
        run: python scripts/calculate_index.py

      # Permanent parallel check: a from-scratch second implementation of the
      # index methodology must agree with calculate_index.py to <0.01 on every
      # point. Two implementations that must always agree — a publish gate, not
      # a vendor change. Catches code drift the benchmark check cannot.
      - name: Verify index (independent reconstruction must match)
        run: python scripts/verify_index_reconstruction.py

      - name: Calculate bottleneck-weighted composite (own Δ=0 self-check)
        run: python scripts/calculate_bottleneck_composite.py

      # Standing MS-vs-Yahoo cross-check — catches the next RTX/Ibiden. Runs
      # AFTER the index so it gates the commit (corruption → job fails → no
      # publish). Distinguishes vendor lag (date mismatch, expected) from
      # corruption (same date, prices diverge). Sundays = full universe.
      - name: MS-vs-Yahoo parity guard
        env:
          MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
        run: |
          if [ "$(date -u +%u)" = "7" ]; then
            python scripts/parity_guard.py --weekly
          else
            python scripts/parity_guard.py --daily
          fi

      - name: Fetch fundamentals (weekly — Mondays only)
        if: github.event.schedule == '0 6 * * 1' || github.event_name == 'workflow_dispatch'
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: python scripts/fetch_fundamentals.py

      # (EOD live-prices step removed at cutover — EODHD, fetcher archived)

      - name: Fetch commodities prices
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: python scripts/fetch_commodities.py
        continue-on-error: true

      - name: Fetch earnings calendar (weekly — Mondays only)
        if: github.event.schedule == '0 6 * * 1' || github.event_name == 'workflow_dispatch'
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: python scripts/fetch_earnings_calendar.py
        continue-on-error: true

      - name: Calculate public markets metrics
        run: python scripts/calculate_metrics.py

      - name: Install dependencies for news
        run: pip install feedparser

      - name: Fetch news (RSS feeds — daily)
        run: python scripts/fetch_news.py
        continue-on-error: true

      - name: Commit price, index & news data
        run: |
          git config user.name "Robotnik Pipeline"
          git config user.email "data@robotniks.com"
          git add data/prices/ data/index/ data/markets/ data/news.json data/funding/
          if git diff --cached --quiet; then
            echo "No price/index/news changes — skipping commit"
          else
            git commit -m "data: daily price & index update $(date -u +%Y-%m-%d)"
            git push
          fi

  fetch-intel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1-5')
      || (github.event_name == 'workflow_dispatch' && inputs.run_intel == true)
      && github.event.schedule != '0 5 * * 0'
    needs: fetch-prices

    steps:
      - name: Check if Monday
        if: github.event_name == 'schedule'
        run: |
          DAY=$(date -u +%u)
          if [ "$DAY" != "1" ]; then
            echo "Not Monday (day=$DAY) — skipping intel fetch"
            exit 0
          fi

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch research papers (OpenAlex)
        run: python scripts/fetch_research.py

      - name: Fetch news (RSS feeds)
        run: python scripts/fetch_news.py

      - name: Fetch SEC filings (EDGAR)
        run: python scripts/fetch_filings.py

      - name: Fetch industry reports (IFR/SEMI/SIA)
        run: python scripts/fetch_reports.py
        continue-on-error: true

      - name: Commit intel data
        run: |
          git config user.name "Robotnik Pipeline"
          git config user.email "data@robotniks.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No intel changes — skipping commit"
          else
            git commit -m "data: weekly intel update $(date -u +%Y-%m-%d)"
            git push
          fi

  # ── Weekly health check (Sunday 23:00 UTC) ──
  health-check:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 23 * * 0'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run quarantine health check
        run: python scripts/quarantine_health_check.py
      - name: Commit health report
        run: |
          git config user.name "Robotnik Pipeline"
          git config user.email "data@robotniks.com"
          git add data/quarantine/weekly_report.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "report: weekly quarantine health check $(date -u +%Y-%m-%d)"
            git push
          fi
